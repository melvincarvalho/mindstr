<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Type a topic, watch a mind map grow. Built in your browser with your own Claude API key." />
    <meta name="color-scheme" content="light dark" />
    <title>Make a map · Mindstr</title>
    <link rel="icon" href="../favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f7f7fa; --raised: #ffffff; --border: #e3e4ea; --text: #1b1f27; --muted: #5f6675;
        --accent: #6d4aff; --accent-text: #ffffff; --accent-soft: rgb(109 74 255 / 0.14); --danger: #c0392b;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #14161c; --raised: #20242e; --border: #2d323e; --text: #f4f5f8; --muted: #9aa2b1; --accent: #a28bff; --accent-text: #14161c; --accent-soft: rgb(162 139 255 / 0.22); --danger: #ff7b6b; }
      }
      * { box-sizing: border-box }
      [hidden] { display: none !important }
      html, body { height: 100% }
      body { margin: 0; background: var(--bg); color: var(--text); font: 500 15px/1.45 Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden }
      a { color: var(--accent) }
      button, input, select { font: inherit; color: inherit }
      .top { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 20px max(16px, env(safe-area-inset-left)) 10px; transition: padding .3s }
      body.home .top { flex: 1; justify-content: center; padding-bottom: 18vh }
      .logo { font-weight: 800; font-size: 44px; letter-spacing: -0.03em; color: var(--text); text-decoration: none; display: flex; align-items: baseline; gap: 10px }
      .logo small { font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: 0 }
      body.built .logo { font-size: 20px }
      body.built .logo small { display: none }
      form.q { display: flex; width: min(680px, 100%); gap: 8px }
      .box { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--raised); border: 1px solid var(--border); border-radius: 999px; padding: 0 8px 0 18px; box-shadow: 0 4px 18px rgb(30 30 60 / 0.08); min-width: 0 }
      .box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft) }
      .box input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 17px; padding: 13px 0 }
      body.built .box input { font-size: 15px; padding: 9px 0 }
      .btn { border: 1px solid var(--border); background: var(--raised); border-radius: 999px; padding: 8px 16px; cursor: pointer; font-weight: 700 }
      .btn:hover { border-color: var(--accent) }
      .btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent }
      .btn:disabled { opacity: .5; cursor: default }
      .icon { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; color: var(--muted); font-size: 18px }
      .icon:hover, .icon[aria-expanded="true"] { background: var(--accent-soft); color: var(--accent) }
      .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px }
      .chip { border: 1px solid var(--border); background: var(--raised); border-radius: 999px; padding: 6px 14px; cursor: pointer; color: var(--muted) }
      .chip:hover { color: var(--accent); border-color: var(--accent) }
      body.built .chips { display: none }
      .panel { width: min(680px, 100%); background: var(--raised); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 16px }
      .panel label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600 }
      .panel input, .panel select { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; font-weight: 600; color: var(--text); width: 100% }
      .panel .wide { grid-column: 1 / -1 }
      .panel .note { grid-column: 1 / -1; font-size: 12px; color: var(--muted); margin: 0 }
      .prices { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 16px }
      .prices .plabel { grid-column: 1 / -1; font-size: 13px; color: var(--muted); font-weight: 600 }
      .prices .pair { display: flex; gap: 6px }
      .panel output { font-weight: 700; color: var(--text); margin-left: 4px }
      main { position: relative; flex: 1; min-height: 0 }
      body.home main { display: none }
      canvas { display: block; width: 100%; height: 100% }
      .status { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--raised); border: 1px solid var(--border); border-radius: 999px; padding: 7px 14px; font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis }
      .status.err { color: var(--danger); border-color: var(--danger); white-space: normal }
      .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite alternate }
      .status.done .dot { animation: none; background: #2ea44f }
      @keyframes pulse { to { opacity: .25 } }
      .actions { position: absolute; top: 12px; right: max(12px, env(safe-area-inset-right)); display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px }
      .actions .btn { padding: 6px 12px; font-size: 13px; box-shadow: 0 2px 10px rgb(30 30 60 / 0.08) }
      .hint { position: absolute; top: 14px; left: max(14px, env(safe-area-inset-left)); font-size: 12px; color: var(--muted) }
    </style>
  </head>
  <body class="home">
    <header class="top">
      <a class="logo" href="../">mindstr <small>make</small></a>
      <form class="q" id="form" autocomplete="off">
        <div class="box">
          <input id="q" placeholder="What shall we map?" aria-label="Topic" maxlength="200" />
          <button type="button" class="icon" id="gear" title="Settings" aria-expanded="false" aria-controls="settings">⚙</button>
        </div>
        <button class="btn primary" id="go">Build</button>
      </form>
      <div class="chips" id="chips">
        <button type="button" class="chip">Czech noun cases</button>
        <button type="button" class="chip">How a Bitcoin block is made</button>
        <button type="button" class="chip">The Odyssey, book by book</button>
      </div>
      <section class="panel" id="settings" hidden>
        <label class="wide">Claude API key
          <input id="key" type="password" placeholder="sk-ant-…" spellcheck="false" />
        </label>
        <p class="note">Kept in this browser only (localStorage) and sent only to api.anthropic.com. Get one at <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>.</p>
        <label>Depth <output id="depthOut">2</output>
          <input id="depth" type="range" min="1" max="4" value="2" />
        </label>
        <label>Breadth <output id="breadthOut">5</output>
          <input id="breadth" type="range" min="3" max="7" value="5" />
        </label>
        <label>Model
          <select id="model">
            <option value="claude-haiku-5-5">Haiku 5.5 · fast</option>
            <option value="claude-sonnet-5-5">Sonnet 5.5</option>
            <option value="claude-opus-5-5">Opus 5.5 · best</option>
          </select>
        </label>
        <label>Style
          <select id="style">
            <option value="overview">Overview</option>
            <option value="study">Study notes</option>
            <option value="plan">Plan of action</option>
            <option value="questions">Questions to ask</option>
          </select>
        </label>
        <label>Language
          <input id="lang" value="English" />
        </label>
        <label>Thinking
          <select id="think">
            <option value="no">Off · fastest (Opus still thinks a little)</option>
            <option value="yes">Adaptive · slower, more considered</option>
          </select>
        </label>
        <div class="wide prices">
          <span class="plabel">Prices, $ per million tokens (in / out)</span>
          <label>Haiku 5.5 <span class="pair"><input id="p-haiku-in" type="number" step="0.01" min="0" /><input id="p-haiku-out" type="number" step="0.01" min="0" /></span></label>
          <label>Sonnet 5.5 <span class="pair"><input id="p-sonnet-in" type="number" step="0.01" min="0" /><input id="p-sonnet-out" type="number" step="0.01" min="0" /></span></label>
          <label>Opus 5.5 <span class="pair"><input id="p-opus-in" type="number" step="0.01" min="0" /><input id="p-opus-out" type="number" step="0.01" min="0" /></span></label>
          <p class="note">Defaults from <a href="https://platform.claude.com/docs/en/about-claude/pricing" target="_blank" rel="noopener">the pricing page</a> on 4 Nov 2026. Change them here if they move.</p>
        </div>
        <label>Links
          <select id="links">
            <option value="no">None</option>
            <option value="yes">Add links when sure of the URL</option>
          </select>
        </label>
      </section>
    </header>
    <main>
      <canvas id="map"></canvas>
      <div class="hint">Click a leaf to grow it</div>
      <div class="actions" id="actions" hidden>
        <button class="btn" id="copy">Copy JSON-LD</button>
        <button class="btn" id="copyMd">Copy outline</button>
        <button class="btn" id="download">Download</button>
        <button class="btn" id="save">Save to pod</button>
        <a class="btn" id="open" hidden target="_blank" rel="noopener">Open in Mindstr ↗</a>
      </div>
      <div class="status" id="status" hidden></div>
    </main>
    <script type="module" src="make.js"></script>
  </body>
</html>
